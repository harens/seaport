[project]
name = "seaport"
version = "0.10.1"
description = "The modern MacPorts portfile updater"
authors = [{ name = "harens", email = "harensdeveloper@gmail.com" }]
requires-python = ">=3.7,<4.0"
readme = "README.rst"
license = "BSD-3-Clause"
maintainers = [{ name = "harens", email = "harensdeveloper@gmail.com" }]
keywords = ["MacPorts", "Port", "Bump", "Checksums"]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.3",
    "beartype>=0.12",
    "typing-extensions>=4.0.0 ; python_version < '3.9'",
]

[project.urls]
Homepage = "https://seaport.rtfd.io/"
Repository = "https://github.com/harens/seaport"
Documentation = "https://seaport.rtfd.io/"
"Bug Tracker" = "https://github.com/harens/seaport/issues"

[project.scripts]
seaport = "seaport._init:seaport"

[dependency-groups]
dev = [
    "pytest>=7.4.2,<8",
    "black>=23.3.0,<24",
    "isort>=5.11.5",
    "pytest-subprocess>=1.5.0,<2",
    "pytest-mock>=3.11.1,<4",
    "pytest-cov>=4.1.0,<5",
    "coverage>=7.2.7,<8",
    "pydocstyle>=6.3.0,<7",
    "pre-commit>=2.21.0",
    "pyupgrade>=3.3.2",
    "Sphinx~=5.3.0",
    "sphinx-autobuild>=2021.3.14,<2022",
    "sphinx-click>=4.4.0,<5",
    "sphinxcontrib-programoutput>=0.17,<0.18",
    "commitizen>=3.8.0",
    "mypy>=1.4.1",
]

[tool.hatch.build.targets.sdist.force-include]
"seaport/py.typed" = "seaport/py.typed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

# See https://pycqa.github.io/isort/docs/configuration/black_compatibility/
[tool.isort]
profile = "black"
multi_line_output = 3

# See https://black.readthedocs.io/en/stable/compatible_configs.html#pylint
[tool.pylint.messages_control]
disable = "C0330, C0326"

[tool.pylint.format]
max-line-length = "88"

[tool.black]
target-version = ["py37"]

[tool.commitizen]
version = "0.10.1"
tag_format = "v$version"
version_files = ["pyproject.toml:version", "seaport/__init__.py"]
